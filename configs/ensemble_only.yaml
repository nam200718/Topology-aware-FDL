# Standalone Hierarchical Ensemble Evaluation Config (CIFAR-10 ResNet9)
# Runs ONLY Hierarchical Ensemble across 5 scenarios to quickly benchmark against previous baselines.

experiment_type: comparison
num_rounds: 25

env:
  seed: 42
  output_dir: ./outputs
  dataset: cifar10
  train_subset: 10000
  test_subset: 3000

clients:
  model_name: resnet9
  num_clients: 15
  local_lr: 0.05
  local_steps: 3
  compute_optimization_mode: shared_backbone
  ensemble_weighting_mode: dynamic_confidence
  ensemble_distillation: true
  distillation_lambda: 0.5
  total_local_steps: 10
  loss_weight_beta: 1.0

topologies:
  - type: hierarchical_ensemble
    label: "Hierarchical Ensemble (Adaptive Update-Sim + PSHR)"
    params:
      num_clusters: 3
      cluster_method: "update_similarity"
      warmup_min_rounds: 2
      warmup_max_rounds: 10
      stability_threshold: 0.30
      misalignment_threshold: 0.15
      personalization_method: "none"

scenarios:
  - id: iid
    label: "IID (Baseline)"
    non_iid: false
  - id: non_iid_alpha_1.0
    label: "Non-IID (Mild alpha=1.0)"
    non_iid: true
    alpha: 1.0
  - id: non_iid_alpha_0.5
    label: "Non-IID (Moderate alpha=0.5)"
    non_iid: true
    alpha: 0.5
  - id: non_iid_alpha_0.1
    label: "Non-IID (Severe alpha=0.1)"
    non_iid: true
    alpha: 0.1
  - id: non_iid_alpha_0.05
    label: "Non-IID (Extreme alpha=0.05)"
    non_iid: true
    alpha: 0.05
