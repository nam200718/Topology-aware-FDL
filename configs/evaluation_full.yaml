# Rigorous Evaluation Config (CIFAR-10 ResNet9)
# Larger subset sizes for publication-grade benchmark statistical stability.

experiment_type: comparison
num_rounds: 30

env:
  seed: 42
  output_dir: ./outputs
  dataset: cifar10
  train_subset: 10000
  test_subset: 3000

clients:
  model_name: resnet9
  num_clients: 15
  local_lr: 0.03
  local_steps: 3
  # Ensemble Improvements & Topology Optimizations:
  compute_optimization_mode: shared_backbone
  ensemble_weighting_mode: dynamic_confidence
  ensemble_distillation: true
  distillation_lambda: 0.5
  total_local_steps: 10
  loss_weight_beta: 1.0

robustness:
  byzantine_type: label_flip

topologies:
  - type: star
    label: "Star (FedAvg)"
    params:
      personalization_method: "none"
  - type: star
    label: "Star (Ditto)"
    params:
      personalization_method: "ditto"
      ditto_lambda: 0.1
  - type: star
    label: "Star (APFL)"
    params:
      personalization_method: "apfl"
      apfl_alpha: 0.5
  - type: hierarchical_ensemble
    label: "Hierarchical Ensemble (Intrinsic Optimized)"
    params:
      num_clusters: 3
      cluster_by_label_dist: true
      personalization_method: "none"

scenarios:
  - id: iid
    label: "IID (Baseline)"
    non_iid: false
  - id: non_iid_alpha_1.0
    label: "Non-IID (Mild alpha=1.0)"
    non_iid: true
    alpha: 1.0
  - id: non_iid_alpha_0.5
    label: "Non-IID (Moderate alpha=0.5)"
    non_iid: true
    alpha: 0.5
  - id: non_iid_alpha_0.1
    label: "Non-IID (Severe alpha=0.1)"
    non_iid: true
    alpha: 0.1
  - id: non_iid_alpha_0.05
    label: "Non-IID (Extreme alpha=0.05)"
    non_iid: true
    alpha: 0.05
