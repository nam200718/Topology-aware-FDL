# Paper Fig 2 convergence trajectories (per-round evaluation)
experiment_type: comparison
num_rounds: 25
eval_interval: 1

env:
  seed: 42
  output_dir: ./outputs
  dataset: cifar10
  train_subset: 10000
  test_subset: 3000

clients:
  model_name: resnet9
  num_clients: 15
  local_lr: 0.05
  local_steps: 3
  total_local_steps: 5

topologies:
  - type: star
    label: "Conv Star (FedAvg)"
    params:
      personalization_method: "none"
  - type: star
    label: "Conv Star (Ditto)"
    params:
      personalization_method: "ditto"
      ditto_lambda: 0.05
  - type: hierarchical_ensemble
    label: "Conv HEP"
    params:
      num_clusters: 3
      cluster_method: "update_similarity"
      personalization_method: "none"

scenarios:
  - id: iid
    label: "IID (Baseline)"
    non_iid: false
  - id: non_iid_alpha_0.05
    label: "Non-IID (Extreme alpha=0.05)"
    non_iid: true
    alpha: 0.05
