# Quick fix check: the exact failing cell (FedAvg, extreme, seed 123)
experiment_type: comparison
num_rounds: 25
eval_interval: 5

env:
  seed: 123
  output_dir: ./outputs
  dataset: cifar10
  train_subset: 10000
  test_subset: 3000

clients:
  model_name: resnet9
  num_clients: 15
  local_lr: 0.05
  local_steps: 3
  total_local_steps: 5

topologies:
  - type: star
    label: "Star (FedAvg)"
    params:
      personalization_method: "none"

scenarios:
  - id: non_iid_alpha_0.05
    label: "Non-IID (Extreme alpha=0.05)"
    non_iid: true
    alpha: 0.05
