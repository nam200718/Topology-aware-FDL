# Topology Comparison Study across Non-IID Dirichlet Spectrum (Topology-Intrinsic Optimizations)
# Compares standard topologies (Star, Hierarchical Standard) against the Optimized Hierarchical Ensemble
# featuring topology-intrinsic optimizations: Dual Aggregation Routing, Shared Backbone Multi-Head,
# Label-Distribution Aware Graph Clustering, Multi-Tier Distillation, and Dynamic Confidence Weighting.

experiment_type: comparison
num_rounds: 15

env:
  seed: 42
  output_dir: ./outputs
  dataset: mnist
  train_subset: 10000
  test_subset: 2000

clients:
  num_clients: 15
  local_lr: 0.05
  local_steps: 1
  # Topology-Intrinsic Optimization Suite:
  compute_optimization_mode: shared_backbone
  ensemble_weighting_mode: dynamic_confidence
  ensemble_distillation: true
  distillation_lambda: 0.5

robustness:
  byzantine_type: label_flip

topologies:
  - type: star
    label: "Star (FedAvg)"
  - type: hierarchical
    label: "Hierarchical (Standard)"
    params:
      num_clusters: 3
  - type: hierarchical_ensemble
    label: "Hierarchical Ensemble (Intrinsic Optimized)"
    params:
      num_clusters: 3
      cluster_by_label_dist: true

scenarios:
  - id: iid
    label: "IID (Baseline)"
    non_iid: false
  - id: non_iid_alpha_1.0
    label: "Non-IID (Mild alpha=1.0)"
    non_iid: true
    alpha: 1.0
  - id: non_iid_alpha_0.5
    label: "Non-IID (Moderate alpha=0.5)"
    non_iid: true
    alpha: 0.5
  - id: non_iid_alpha_0.1
    label: "Non-IID (Severe alpha=0.1)"
    non_iid: true
    alpha: 0.1
  - id: non_iid_alpha_0.05
    label: "Non-IID (Extreme alpha=0.05)"
    non_iid: true
    alpha: 0.05
