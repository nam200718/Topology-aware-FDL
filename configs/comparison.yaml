# Topology & Personalization Algorithm Comparison Study (CIFAR-10 ResNet9)
# Compares flat baselines (Star/FedAvg, Star+Ditto, Star+APFL Shared Backbone) against our 3-Tier Hierarchical Ensemble Topology.

experiment_type: comparison
num_rounds: 25
eval_interval: 5

env:
  seed: 42
  output_dir: ./outputs
  dataset: cifar10
  train_subset: 10000
  test_subset: 3000

clients:
  model_name: resnet9
  num_clients: 15
  local_lr: 0.05
  local_steps: 3
  # Ensemble Improvements & Topology Optimizations:
  compute_optimization_mode: shared_backbone
  ensemble_weighting_mode: dynamic_confidence
  ensemble_distillation: false
  distillation_lambda: 0.0
  # Budget 5 validated >= budget 10 on IID + moderate skew at ~2x less wall
  # time (see docs/experiment_learnings_and_failed_attempts.md section 4d);
  # keeps HEP local compute comparable to baselines (local_steps=3).
  total_local_steps: 5
  loss_weight_beta: 1.0

robustness:
  byzantine_type: label_flip

topologies:
  - type: star
    label: "Star (FedAvg)"
    params:
      personalization_method: "none"
  - type: star
    label: "Star (Ditto)"
    params:
      personalization_method: "ditto"
      ditto_lambda: 0.05
  - type: star
    label: "Star (APFL - Shared Backbone)"
    params:
      personalization_method: "apfl"
      compute_optimization_mode: "shared_backbone"
      apfl_alpha: 0.5
  - type: hierarchical_ensemble
    label: "Hierarchical Ensemble (Adaptive Update-Sim)"
    params:
      num_clusters: 3
      cluster_method: "update_similarity"
      warmup_min_rounds: 2
      warmup_max_rounds: 10
      stability_threshold: 0.30
      misalignment_threshold: 0.15
      personalization_method: "none"

scenarios:
  - id: iid
    label: "IID (Baseline)"
    non_iid: false
  - id: non_iid_alpha_1.0
    label: "Non-IID (Mild alpha=1.0)"
    non_iid: true
    alpha: 1.0
  - id: non_iid_alpha_0.5
    label: "Non-IID (Moderate alpha=0.5)"
    non_iid: true
    alpha: 0.5
  - id: non_iid_alpha_0.1
    label: "Non-IID (Severe alpha=0.1)"
    non_iid: true
    alpha: 0.1
  - id: non_iid_alpha_0.05
    label: "Non-IID (Extreme alpha=0.05)"
    non_iid: true
    alpha: 0.05
