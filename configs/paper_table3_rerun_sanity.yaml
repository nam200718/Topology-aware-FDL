# Sanity rows for corrected baselines (IID + extreme skew only).
experiment_type: comparison
num_rounds: 25
eval_interval: 5

env:
  seed: 42
  output_dir: ./outputs/baseline_fidelity
  dataset: cifar10
  train_subset: 10000
  test_subset: 3000

clients:
  model_name: resnet9
  num_clients: 15
  local_lr: 0.05
  local_steps: 3
  total_local_steps: 5

topologies:
  - type: star
    label: "Star (FedRep)"
    params:
      personalization_method: "fedrep"
  - type: star
    label: "Star (Ditto)"
    params:
      personalization_method: "ditto"
      ditto_lambda: 0.1
  - type: star
    label: "Star (APFL)"
    params:
      personalization_method: "apfl"

scenarios:
  - id: iid
    label: "IID (Baseline)"
    non_iid: false
  - id: non_iid_alpha_0.05
    label: "Non-IID (Extreme alpha=0.05)"
    non_iid: true
    alpha: 0.05
