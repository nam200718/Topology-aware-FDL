[project]
name = "topology-aware-fdl"
version = "0.1.0"
description = "Topology-aware Federated Deep Learning"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "seaborn",
    "networkx",
    "pydantic",
    "scikit-learn",
    "tqdm",
    "torch",
    "torchvision",
    "pytest",
    "pyyaml",
]

[tool.basedpyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
pythonPlatform = "Linux"
extraPaths = ["."]
typeCheckingMode = "standard"
reportPrivateImportUsage = false
exclude = [
    "**/node_modules",
    "**/__pycache__",
    ".venv*",
    "data",
    "outputs",
    "notebook_training",
    "colab",
    "temp",
    "scratch",
    "scripts/archive",
    "**/*.ipynb",
]
