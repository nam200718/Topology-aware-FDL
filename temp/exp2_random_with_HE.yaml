clients:
  batch_size: 32
  compute_optimization_mode: shared_backbone
  distillation_lambda: 0.5
  ensemble_distillation: true
  ensemble_weighting_mode: dynamic_confidence
  local_lr: 0.01
  local_steps: 2
  loss_weight_beta: 1.0
  model_name: resnet9
  num_clients: 30
  total_local_steps: 5
env:
  dataset: cifar10
  output_dir: ./outputs/exp2_random_with_HE
  seed: 42
non_iid:
  alpha: 0.1
  enabled: true
num_rounds: 50
robustness:
  byzantine_type: none
topologies:
- label: Star (FedAvg)
  params:
    personalization_method: none
  type: star
- label: Ring
  params:
    personalization_method: none
  type: ring
- label: Gossip (k=3)
  params:
    degree_k: 3
  type: gossip
- label: HE Agg-Only
  params:
    cluster_method: update_similarity
    compute_optimization_mode: none
    hierarchical_ensemble: false
    num_clusters: 5
    use_ensemble: false
    warmup_max_rounds: 10
    warmup_min_rounds: 2
  type: hierarchical
- label: HE Ensemble
  params:
    cluster_method: update_similarity
    num_clusters: 5
    warmup_max_rounds: 10
    warmup_min_rounds: 2
  type: hierarchical_ensemble
use_hierarchical_partition: false
