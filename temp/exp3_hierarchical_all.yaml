num_rounds: 50
env:
  seed: 42
  dataset: cifar10
  output_dir: ./outputs/exp3_hierarchical_all
clients:
  model_name: resnet9
  num_clients: 30
  local_lr: 0.01
  local_steps: 2
  batch_size: 32
  compute_optimization_mode: shared_backbone
  ensemble_weighting_mode: dynamic_confidence
  ensemble_distillation: true
  distillation_lambda: 0.5
  total_local_steps: 5
  loss_weight_beta: 1.0
robustness:
  byzantine_type: none
use_hierarchical_partition: true
hierarchical_partition_config:
  num_clusters: 5
  intra_alpha: 1.0
  inter_alpha: 0.1
topologies:
  - type: star
    label: "Star (FedAvg)"
    params:
      personalization_method: none
  - type: ring
    label: "Ring"
    params:
      personalization_method: none
  - type: gossip
    label: "Gossip (k=3)"
    params:
      degree_k: 3
  - type: hier_agg
    label: "HE Agg-Only"
    params:
      num_clusters: 5
      cluster_method: update_similarity
      warmup_min_rounds: 2
      warmup_max_rounds: 10
      use_ensemble: false
      hierarchical_ensemble: false
      compute_optimization_mode: "none"
  - type: hier_ens
    label: "HE Ensemble"
    params:
      num_clusters: 5
      cluster_method: update_similarity
      warmup_min_rounds: 2
      warmup_max_rounds: 10
