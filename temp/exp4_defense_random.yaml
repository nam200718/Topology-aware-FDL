num_rounds: 50
env:
  seed: 42
  dataset: cifar10
  output_dir: ./outputs/exp4_defense_random
clients:
  model_name: resnet9
  num_clients: 30
  local_lr: 0.01
  local_steps: 2
  batch_size: 32
  compute_optimization_mode: shared_backbone
  ensemble_weighting_mode: dynamic_confidence
  ensemble_distillation: true
  distillation_lambda: 0.5
  total_local_steps: 5
  loss_weight_beta: 1.0
non_iid:
  enabled: true
  alpha: 0.1
use_hierarchical_partition: false
byzantine_rates: [0.0, 0.1, 0.2, 0.3]
byzantine_types: ["label_flip", "sign_flip"]
topologies:
  - type: star
    label: "Star (No Defense)"
    params:
      defense_mode: none
  - type: ring
    label: "Ring (No Defense)"
    params:
      defense_mode: none
  - type: hier_ens
    label: "HE (No Defense)"
    params:
      num_clusters: 5
      cluster_method: update_similarity
      warmup_min_rounds: 2
      warmup_max_rounds: 10
      defense_mode: none
  - type: star
    label: "Star (Full Defense)"
    params:
      defense_mode: soft_cosine
  - type: ring
    label: "Ring (Full Defense)"
    params:
      defense_mode: soft_cosine
  - type: hier_ens
    label: "HE (Full Defense)"
    params:
      num_clusters: 5
      cluster_method: update_similarity
      warmup_min_rounds: 2
      warmup_max_rounds: 10
      defense_mode: soft_cosine
